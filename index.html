<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동물상 테스트</title>
  <link href='/style.css' rel='stylesheet'>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <div class="teachable-machine-section">
    <h1>동물상 테스트 (강아지/고양이)</h1>
    <p>사진 파일을 업로드하여 당신의 동물상을 확인해보세요!</p>
    <div>Teachable Machine Image Model</div>
    <input type="file" id="file-input" accept="image/*">
    <img id="uploaded-image" style="max-width: 100%; display: none;">
    <button type="button" id="predict-button" disabled>판단하기</button>
    <div id="label-container"></div>
  </div>

  <main>
    <h1>문의하기</h1>
    <form action="https://formspree.io/f/mlgogndn" method="POST">
      <label for="name">이름:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">이메일:</label>
      <input type="email" id="email" name="_replyto" required>

      <label for="message">메시지:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">보내기</button>
    </form>
  </main>

  <script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/rSgDU3xT0/";
    let model, maxPredictions;

    // Elements
    const fileInput = document.getElementById("file-input");
    const uploadedImage = document.getElementById("uploaded-image");
    const predictButton = document.getElementById("predict-button");
    const labelContainer = document.getElementById("label-container");

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function predict() {
        if (!uploadedImage.src || uploadedImage.style.display === "none") {
            labelContainer.innerHTML = "<div>이미지를 선택해주세요.</div>";
            return;
        }

        const prediction = await model.predict(uploadedImage);
        labelContainer.innerHTML = ""; // Clear previous labels
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(2) + "%";
            const div = document.createElement("div");
            div.textContent = classPrediction;
            labelContainer.appendChild(div);
        }
    }

    fileInput.addEventListener("change", function(event) {
        if (event.target.files && event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage.src = e.target.result;
                uploadedImage.style.display = "block";
                predictButton.disabled = false; // Enable predict button
                labelContainer.innerHTML = ""; // Clear labels on new image
            };
            reader.readAsDataURL(event.target.files[0]);
        } else {
            uploadedImage.src = "";
            uploadedImage.style.display = "none";
            predictButton.disabled = true; // Disable predict button
            labelContainer.innerHTML = ""; // Clear labels
        }
    });

    predictButton.addEventListener("click", predict);

    // Initialize the model when the page loads
    window.onload = init;
  </script>
